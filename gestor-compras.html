<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor Predictivo de Insumos - LoomTech</title>
  
  <link rel="stylesheet" href="general.css">

  <style>
    :root {
      --bg-body: #0b0f17;
      --bg-panel: #131b2e;
      --border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body { background: var(--bg-body); display: flex; flex-direction: column; }
    h2, h3 { color: #f8fafc; margin: 0; }
    label { color: #cbd5e1; font-size: 0.82rem; font-weight: 600; display: block; margin-bottom: 6px; }
    
    .main-header {
      background: var(--bg-panel); border: 1px solid var(--border);
      padding: 20px 28px; border-radius: 12px; margin-bottom: 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-brand { display: flex; align-items: center; gap: 20px; }
    .header-logo { width: 56px; height: 56px; object-fit: contain; }
    .header-title h1 { margin: 0; font-size: 1.4rem; color: var(--primary); }
    .header-title p { margin: 2px 0 0 0; color: var(--text-muted); font-size: 0.85rem; }

    .dashboard-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
    
    .import-panel { background: var(--bg-panel); border: 1px solid var(--border); padding: 24px; border-radius: 12px; height: fit-content; }
    
    .file-drop-area {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 140px; margin-top: 8px; margin-bottom: 20px;
      border: 2px dashed #334155; border-radius: 8px; background: #0f172a;
      transition: 0.2s; text-align: center; color: var(--text-muted);
    }
    .file-drop-area:hover { border-color: var(--primary); background: #18223d; }
    .file-msg { font-size: 0.85rem; margin-top: 8px; font-weight: 600; }
    .file-input { position: absolute; left: 0; top: 0; height: 100%; width: 100%; cursor: pointer; opacity: 0; }

    .table-panel { background: var(--bg-panel); border: 1px solid var(--border); padding: 24px; border-radius: 12px; }
    .table-dark { width: 100%; border-collapse: collapse; margin-top: 16px; color: var(--text-main); }
    .table-dark th { background: #0f172a; color: var(--text-muted); font-weight: 600; padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; text-transform: uppercase;}
    .table-dark td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    
    .select-dark { background: #0f172a; color: white; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; }
    .search-input { width: 220px; }
    input[type="date"] { background: #0f172a; color: white; color-scheme: dark; margin-bottom: 16px;}
    
    .btn-edit-alias { background: none; border: none; font-size: 1rem; cursor: pointer; opacity: 0.5; transition: 0.2s; margin-left: 8px; }
    .btn-edit-alias:hover { opacity: 1; transform: scale(1.1); }

    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .status-green { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-yellow { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-red { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-gray { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-green .pulse-dot { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .status-yellow .pulse-dot { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
    .status-red .pulse-dot { background: #f87171; box-shadow: 0 0 8px #f87171; }
    .status-gray .pulse-dot { background: #94a3b8; }

    /* Alineación superior tabla de inventario */
    .controls-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 16px; }

    @media (max-width: 900px) { .dashboard-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="container" style="max-width: 1200px;">
  
  <div class="main-header">
    <div class="header-brand">
      <img src="logo-transparente.webp" alt="LoomTech" class="header-logo" onerror="this.style.display='none'">
      <div class="header-title">
        <h1>Gestor de Insumos & Radar de Compras</h1>
        <p>Sistema Predictivo de Stock (Burn Rate)</p>
      </div>
    </div>
    <a href="index.html" class="btn-secondary" style="text-decoration: none;">&larr; Volver al Hub</a>
  </div>

  <div class="dashboard-layout">
    
    <div class="import-panel">
      <h2>Importar Compra</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; margin-top:8px;">
        Sube el archivo CSV de ProwireUSA o Mouser.
      </p>

      <label>Fecha (Se auto detecta del CSV)</label>
      <input type="date" id="invoiceDate">

      <label>Cargar Archivo CSV</label>
      <div class="file-drop-area">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="width:36px; height:36px; color:#64748b;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path>
        </svg>
        <span class="file-msg" id="fileMsg">Haz clic o arrastra tu archivo .csv aquí</span>
        <input class="file-input" type="file" id="invoiceFile" accept=".csv, .txt" onchange="updateFileName()">
      </div>

      <button type="button" class="btn btn-block" onclick="processInvoiceFile()">Leer Archivo y Procesar</button>
      
      <div id="importResult" style="margin-top: 16px; font-size: 0.85rem; color: #34d399; font-weight: 600; display: none;"></div>
    </div>

    <div class="table-panel">
      
      <div class="controls-top">
        <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
          <h2>Radar de Inventario</h2>
          <input type="text" id="searchInput" class="select-dark search-input" placeholder="🔍 Buscar SKU o Alias..." oninput="renderInventory()">
        </div>
        
        <div style="display: flex; gap: 10px; align-items: center;">
          <select id="timeFrameSelect" class="select-dark" onchange="renderInventory()">
            <option value="1">Diario</option>
            <option value="30" selected>Mensual</option>
            <option value="60">Bimestral</option>
            <option value="180">Semestral</option>
            <option value="365">Anual</option>
          </select>
          
          <button class="btn-secondary btn-sm" onclick="exportData()" title="Descargar Backup">⬇️</button>
          <input type="file" id="importBackupFile" style="display:none" accept=".json" onchange="importData(event)">
          <button class="btn-secondary btn-sm" onclick="document.getElementById('importBackupFile').click()" title="Subir Backup">⬆️</button>
          <button class="btn-secondary btn-sm btn-danger" onclick="clearInventory()" title="Borrar toda la base">🗑️</button>
        </div>
      </div>

      <table class="table-dark">
        <thead>
          <tr>
            <th>SKU / Alias</th>
            <th>Historial</th>
            <th>Consumo</th>
            <th>Stock Est.</th>
            <th>Estado Actual</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody">
          <!-- Se llena con JS -->
        </tbody>
      </table>
    </div>

  </div>
</div>

<script>
  let inventory = JSON.parse(localStorage.getItem('loomtech_inventory')) || {};

  function init() { renderInventory(); }

  function updateFileName() {
    const input = document.getElementById('invoiceFile');
    const msg = document.getElementById('fileMsg');
    if(input.files && input.files.length > 0) {
      msg.innerText = `Archivo listo: ${input.files[0].name}`;
      msg.style.color = '#34d399';
    } else {
      msg.innerText = 'Haz clic o arrastra tu archivo .csv aquí';
      msg.style.color = 'var(--text-muted)';
    }
  }

  function processInvoiceFile() {
    const fileInput = document.getElementById('invoiceFile');
    if (fileInput.files.length === 0) { alert("Por favor, selecciona un archivo CSV primero."); return; }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
      const fileText = e.target.result;
      processExtractedText(fileText);
    };
    reader.readAsText(file);
  }

  function processExtractedText(text) {
    // 1. SANITIZACIÓN: Eliminar comillas dobles y simples
    const cleanText = text.replace(/["']/g, '');
    let dateStr = document.getElementById('invoiceDate').value;
    
    // 2. BUSCAR FECHA 
    const dateRegex = /Date\s+(\d{2})\/(\d{2})\/(\d{4})/i;
    const dateMatch = dateRegex.exec(cleanText);
    if (dateMatch) {
      dateStr = `${dateMatch[3]}-${dateMatch[1]}-${dateMatch[2]}`;
      document.getElementById('invoiceDate').value = dateStr;
    }

    if (!dateStr) { 
      alert("No se pudo detectar la fecha. Selecciónala manualmente."); 
      return; 
    }

    // 3. EXTRACCIÓN 
    const regex = /^\s*\d+\s+([A-Za-z0-9\-\/]+)\s+([\d\,]+)\s+/gm;
    let match;
    let itemsFound = 0;

    while ((match = regex.exec(cleanText)) !== null) {
      const sku = match[1];
      const qty = parseInt(match[2].replace(/,/g, ''), 10); 
      addPurchase(sku, qty, dateStr);
      itemsFound++;
    }

    if (itemsFound > 0) {
      const res = document.getElementById('importResult');
      res.innerText = `¡Éxito! Fecha: ${dateStr}. Se sumaron ${itemsFound} componentes.`;
      res.style.color = '#34d399';
      res.style.display = 'block';
      
      document.getElementById('invoiceFile').value = ''; 
      updateFileName();
      
      localStorage.setItem('loomtech_inventory', JSON.stringify(inventory));
      renderInventory();
      
      setTimeout(() => res.style.display = 'none', 5000);
    } else {
      const res = document.getElementById('importResult');
      res.innerText = `No se detectaron productos. Revisa el formato del archivo.`;
      res.style.color = '#f87171';
      res.style.display = 'block';
    }
  }

  function addPurchase(sku, qty, dateStr) {
    if (!inventory[sku]) {
      inventory[sku] = { sku: sku, alias: "", history: [] };
    }
    const exists = inventory[sku].history.find(h => h.date === dateStr && h.qty === qty);
    if (!exists) {
      inventory[sku].history.push({ date: dateStr, qty: qty });
    }
  }

  function editAlias(sku) {
    const currentAlias = inventory[sku].alias || "";
    const newAlias = prompt(`Escribe un nombre fácil de recordar para:\n${sku}`, currentAlias);
    
    if (newAlias !== null) {
      inventory[sku].alias = newAlias.trim();
      localStorage.setItem('loomtech_inventory', JSON.stringify(inventory));
      renderInventory();
    }
  }

  function calculatePredictiveStatus(item) {
    const history = item.history.sort((a, b) => new Date(a.date) - new Date(b.date));
    
    if (history.length < 2) {
      // 999 días restantes fuerza a que queden últimos en el orden de urgencia
      return { dailyBurn: 0, estStock: 'N/A', daysLeft: 999, badge: 'status-gray', statusText: 'Aprendiendo...' };
    }

    const firstDate = new Date(history[0].date);
    const lastDate = new Date(history[history.length - 1].date);
    const totalDays = (lastDate - firstDate) / (1000 * 60 * 60 * 24);

    if (totalDays <= 0) return { dailyBurn: 0, estStock: 'N/A', daysLeft: 999, badge: 'status-gray', statusText: 'Aprendiendo...' };

    let totalConsumed = 0;
    for (let i = 0; i < history.length - 1; i++) {
      totalConsumed += history[i].qty;
    }

    const dailyBurn = totalConsumed / totalDays;
    const lastQty = history[history.length - 1].qty;
    const daysSinceLastBuy = (new Date() - lastDate) / (1000 * 60 * 60 * 24);
    let estStock = lastQty - (dailyBurn * daysSinceLastBuy);
    
    if (estStock < 0) estStock = 0;
    const daysLeft = estStock / dailyBurn;

    let badge = 'status-green';
    let statusText = 'En Stock';

    if (daysLeft <= 7 || estStock === 0) {
      badge = 'status-red';
      statusText = 'Urgente';
    } else if (daysLeft <= 25) {
      badge = 'status-yellow';
      statusText = 'Alerta Stock';
    }

    return { dailyBurn: dailyBurn, estStock: Math.floor(estStock), daysLeft: daysLeft, badge: badge, statusText: statusText };
  }

  function renderInventory() {
    const tbody = document.getElementById('inventoryTableBody');
    tbody.innerHTML = '';
    
    const keys = Object.keys(inventory);
    if (keys.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 30px;">El radar está vacío. Sube tu primer archivo CSV.</td></tr>';
      return;
    }

    // Termino de búsqueda
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    
    // Configuración de frecuencia
    const frameSelect = document.getElementById('timeFrameSelect');
    const frameDays = parseInt(frameSelect.value);

    // 1. Filtrar los items en base al buscador
    let filteredItems = keys.map(k => inventory[k]).filter(item => {
      const matchSku = item.sku.toLowerCase().includes(searchTerm);
      const matchAlias = (item.alias || "").toLowerCase().includes(searchTerm);
      return matchSku || matchAlias;
    });

    if (filteredItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 30px;">No se encontraron componentes con esa búsqueda.</td></tr>';
      return;
    }

    // 2. Calcular los estados y ordenar por urgencia (días restantes)
    let itemsWithStats = filteredItems.map(item => {
      return { item: item, stats: calculatePredictiveStatus(item) };
    });
    
    // Ordenar de menor a mayor (Urgente 0 -> Alerta 20 -> Sano 100 -> Aprendiendo 999)
    itemsWithStats.sort((a, b) => a.stats.daysLeft - b.stats.daysLeft);

    // 3. Renderizar la tabla ya ordenada
    itemsWithStats.forEach(data => {
      const item = data.item;
      const stats = data.stats;
      const buyCount = item.history.length;
      
      const displayName = item.alias 
        ? `<strong style="color: #fff; font-size:1.05rem;">${item.alias}</strong><br><span style="color: #64748b; font-size:0.8rem;">${item.sku}</span>` 
        : `<strong style="color: #fff;">${item.sku}</strong>`;

      const displayBurn = stats.dailyBurn > 0 
        ? `${(stats.dailyBurn * frameDays).toFixed(1)} U`
        : '-';
      
      const row = `<tr>
        <td>
          <div style="display:flex; align-items: center;">
            <div>${displayName}</div>
            <button class="btn-edit-alias" onclick="editAlias('${item.sku}')" title="Asignar Alias">✏️</button>
          </div>
        </td>
        <td style="color: #94a3b8;">${buyCount} fact.</td>
        <td style="color: #94a3b8; font-family: monospace; font-size: 0.95rem;">${displayBurn}</td>
        <td style="font-weight: bold; font-size: 1.1rem; color: #fff;">${stats.estStock}</td>
        <td>
          <div class="status-badge ${stats.badge}">
            <span class="pulse-dot"></span> ${stats.statusText}
          </div>
        </td>
      </tr>`;
      tbody.innerHTML += row;
    });
  }

  // --- FUNCIONES DE BACKUP (JSON) ---
  function exportData() {
    const dataStr = JSON.stringify(inventory, null, 2);
    const blob = new Blob([dataStr], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `LoomTech_Insumos_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  function importData(event) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        inventory = JSON.parse(e.target.result);
        localStorage.setItem('loomtech_inventory', JSON.stringify(inventory));
        renderInventory();
        alert("¡Base de datos importada con éxito!");
      } catch(err) {
        alert("Error al leer el archivo JSON de backup.");
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function clearInventory() {
    if(confirm("ATENCIÓN: ¿Estás seguro de borrar toda la base de datos predictiva de insumos?")) {
      localStorage.removeItem('loomtech_inventory');
      inventory = {};
      renderInventory();
    }
  }

  init();
</script>
</body>
</html>
